# path: .github/workflows/ci.yml
name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-api:
    name: Test API & Ingest (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: api/go.sum

      - name: Verify Go modules & vet
        working-directory: ./api
        run: |
          go mod verify
          go vet ./...

      - name: Run Go Unit Tests
        working-directory: ./api
        run: go test -v -race ./...

  test-agents:
    name: Test Telemetry Agents (Node & Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Agent
        working-directory: ./packages/agent-go
        run: |
          go vet ./...
          go test -v ./...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test Node.js Agent
        working-directory: ./packages/agent-node
        run: |
          npm ci
          npm test

  test-web:
    name: Test Web Dashboard (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: TypeScript Typecheck & Build
        working-directory: ./web
        run: |
          npm run type-check
          npm run build

  test-demo:
    name: Test Traffic Simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies & Build
        working-directory: ./demo
        run: |
          npm ci
          npm run build
